name: Pages contract

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: HTML, scripts, and installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate homepage HTML
        run: npx --yes html-validate@11.6.0 index.html

      - name: Validate browser JavaScript
        run: node --check js/main.js

      - name: Validate installer shell
        run: shellcheck --shell=sh --severity=style cycles wasted w

      - name: Verify canonical installer parity
        run: |
          set -eu
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/zozo123/wasted-cycles/main/run \
            --output /tmp/wasted-cycles-run
          for endpoint in cycles wasted w; do
            if ! cmp -s "$endpoint" /tmp/wasted-cycles-run; then
              echo "::error::$endpoint has drifted from zozo123/wasted-cycles main/run"
              diff -u "$endpoint" /tmp/wasted-cycles-run || true
              exit 1
            fi
          done

      - name: Exercise latest and pinned installs
        run: |
          set -eu
          latest="$(sh ./cycles --version)"
          pinned="$(WASTED_CYCLES_VERSION=v0.6.1 sh ./cycles --version)"
          branded_alias="$(sh ./wasted --version)"
          legacy="$(sh ./w --version)"
          echo "latest: $latest"
          echo "pinned: $pinned"
          echo "branded alias: $branded_alias"
          echo "legacy alias: $legacy"
          case "$latest" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "unexpected latest version: $latest" >&2; exit 1 ;;
          esac
          [ "$pinned" = "v0.6.1" ]
          [ "$branded_alias" = "$latest" ]
          [ "$legacy" = "$latest" ]
